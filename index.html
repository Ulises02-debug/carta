<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>Tienes una carta</title>
<meta property="og:title" content="Tienes una carta ✉️">
<meta property="og:description" content="Tócala para abrirla">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
body{background:linear-gradient(180deg,#080c26 0%,#1a2557 55%,#5b3f78 85%,#c8805f 100%)}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}

.dawn{position:fixed;left:0;right:0;bottom:0;height:60%;opacity:0;transition:opacity 5s ease;z-index:0;
  background:radial-gradient(ellipse 70% 90% at 50% 105%,
    rgba(255,210,140,.85),
    rgba(255,160,110,.35) 45%,
    transparent 75%)}
body.open .dawn{opacity:1}

.mountains{position:fixed;left:0;right:0;bottom:0;width:100%;height:42vh;z-index:1;pointer-events:none}

#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);z-index:2}
.hint{color:#ffe9b0;font-size:17px;letter-spacing:.05em;text-shadow:0 0 12px rgba(255,220,140,.6);animation:pulse 2.4s ease-in-out infinite}
body.open .hint{animation:none;opacity:0;transition:opacity .6s}
@keyframes pulse{50%{opacity:.4}}

.env{--w:min(86vw,380px);position:relative;width:var(--w);height:calc(var(--w)*.7);perspective:900px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;animation:float 4s ease-in-out infinite;
  transition:transform 1.4s cubic-bezier(.3,.8,.3,1)}
body.open .env{animation:none;transform:translateY(20vh)}
@keyframes float{0%,100%{transform:translateY(5vh)}50%{transform:translateY(calc(5vh - 7px))}}

.env>div{position:absolute}

/* SOBRE CHOCOLATE CLARO (tono leche) */
.back{inset:0;background:linear-gradient(180deg,#b8895e,#9a6e44);border-radius:6px;
  box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.18);z-index:1}

/* HOJA CHOCOLATE CLARO (tono leche) */
.paper{left:5%;width:90%;bottom:8%;height:78%;
  background:linear-gradient(180deg,#c99a70 0%,#b98a60 55%,#a4764c 100%);
  border-radius:4px;z-index:2;overflow:hidden;position:relative;
  padding:7% 10% 9%;
  box-shadow:0 4px 20px rgba(0,0,0,.45),inset 0 0 30px rgba(120,70,30,.25);
  transition:height 1.6s cubic-bezier(.3,.8,.3,1) .5s}
body.open .paper{height:245%}
body.read .paper{box-shadow:0 0 55px rgba(255,210,140,.5),inset 0 0 30px rgba(120,70,30,.25)}

/* BORDE DECORADO TIPO PAPEL ANTIGUO */
.paper::before{
  content:"";position:absolute;inset:10px;border:1.5px double rgba(90,50,15,.55);
  border-radius:4px;pointer-events:none;z-index:2}
.paper::after{
  content:"";position:absolute;inset:16px;border:1px solid rgba(90,50,15,.35);
  border-radius:2px;pointer-events:none;z-index:2}

/* Esquinas ornamentales */
.corner{position:absolute;width:34px;height:34px;z-index:3;pointer-events:none;opacity:.75}
.corner.tl{top:14px;left:14px}
.corner.tr{top:14px;right:14px;transform:scaleX(-1)}
.corner.bl{bottom:14px;left:14px;transform:scaleY(-1)}
.corner.br{bottom:14px;right:14px;transform:scale(-1,-1)}

.watermark{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.front{inset:0;z-index:4;background:linear-gradient(180deg,#b8895e,#9a6e44);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{left:0;top:0;width:100%;height:56%;z-index:5;
  background:linear-gradient(180deg,#c99a70,#a97a52);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;
  transition:transform .9s ease,z-index 0s .45s}
body.open .flap{transform:rotateX(180deg);z-index:0}

.seal{left:50%;top:56%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;z-index:6;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ff8a9a,#c2185b);
  box-shadow:0 3px 10px rgba(194,24,91,.55),inset 0 -2px 4px rgba(0,0,0,.15);transition:opacity .4s}
.seal svg{width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
body.open .seal{opacity:0}
body.read .back,body.read .front,body.read .flap{opacity:0;transition:opacity 1.6s ease}

#text{position:relative;z-index:1}
.l{opacity:0;transform:translateY(8px);animation:in 1.2s ease forwards}
@keyframes in{to{opacity:1;transform:none}}

h1{font-family:'Segoe Script','Brush Script MT','Snell Roundhand',cursive;font-weight:400;
  font-size:clamp(28px,8vw,40px);color:#fff5d6;margin-bottom:14px;text-align:center;
  text-shadow:0 2px 6px rgba(60,30,10,.5)}

p{font-size:clamp(15px,4.2vw,17px);line-height:1.6;color:#fff8e7;margin-bottom:11px;
  text-shadow:0 1px 3px rgba(60,30,10,.45)}

.para{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ffe9bf;
  margin-bottom:10px;text-align:center;text-shadow:0 1px 3px rgba(60,30,10,.5)}

/* Firma */
.firma{margin-top:22px;text-align:right;color:#fff5d6;
  text-shadow:0 1px 3px rgba(60,30,10,.5);line-height:1.4}
.firma .bendiciones{font-style:italic;font-size:clamp(16px,4.5vw,19px)}
.firma .atte{font-family:'Segoe Script','Brush Script MT','Snell Roundhand',cursive;
  font-size:clamp(20px,5.5vw,26px);margin-top:6px;display:block}

@media (prefers-reduced-motion:reduce){.env,.hint{animation:none}.paper{transition-duration:.01s}.l{opacity:1;transform:none;animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="dawn"></div>

<!-- Montañas con valle central -->
<svg class="mountains" viewBox="0 0 1000 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,300 L0,160 L90,90 L180,140 L280,70 L370,150 L450,190 L500,205 L550,190 L630,150 L720,70 L820,140 L910,90 L1000,160 L1000,300 Z"
        fill="rgba(40,55,110,0.30)"/>
  <path d="M0,300 L0,230 L110,170 L220,230 L330,150 L420,220 L480,250 L520,250 L580,220 L670,150 L780,230 L890,170 L1000,230 L1000,300 Z"
        fill="rgba(15,22,60,0.45)"/>
</svg>

<main id="stage">
  <div class="hint">Tienes una carta</div>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Abrir la carta">
    <div class="back"></div>

    <div class="paper">
      <!-- Marca de agua: nutria con cola ancha -->
      <svg class="watermark" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <defs>
          <pattern id="otter-tile" x="0" y="0" width="110" height="110" patternUnits="userSpaceOnUse">
            <g opacity="0.11" transform="translate(55,55) scale(0.8) translate(-50,-55)">
              <!-- NUTRIA con cola ancha -->
              <!-- Cola ancha y gruesa a la derecha -->
              <path d="M78 70 Q96 68 104 76 Q100 84 86 84 Q78 82 76 76 Z" fill="#ffffff"/>

              <!-- Cuerpo redondeado -->
              <ellipse cx="48" cy="60" rx="30" ry="26" fill="#ffffff"/>

              <!-- Cabeza ancha -->
              <ellipse cx="48" cy="40" rx="26" ry="20" fill="#ffffff"/>

              <!-- Orejas laterales redondas -->
              <circle cx="26" cy="26" r="6" fill="#ffffff"/>
              <circle cx="70" cy="26" r="6" fill="#ffffff"/>

              <!-- Hocico redondo y ancho -->
              <ellipse cx="48" cy="48" rx="18" ry="12" fill="#ffffff"/>

              <!-- Ojos grandes -->
              <ellipse cx="38" cy="38" rx="3.5" ry="4" fill="#1a1a1a"/>
              <ellipse cx="58" cy="38" rx="3.5" ry="4" fill="#1a1a1a"/>
              <circle cx="39" cy="36.5" r="1.2" fill="#ffffff"/>
              <circle cx="59" cy="36.5" r="1.2" fill="#ffffff"/>

              <!-- Nariz ancha -->
              <ellipse cx="48" cy="45" rx="4.5" ry="3" fill="#1a1a1a"/>
              <ellipse cx="47" cy="44" rx="1.2" ry="0.8" fill="#ffffff" opacity="0.6"/>

              <!-- Sonrisa -->
              <path d="M42 52 Q48 57 54 52" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>

              <!-- Bigotes (3 por lado) -->
              <line x1="32" y1="46" x2="20" y2="43" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
              <line x1="32" y1="49" x2="20" y2="50" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
              <line x1="32" y1="52" x2="20" y2="56" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
              <line x1="64" y1="46" x2="76" y2="43" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
              <line x1="64" y1="49" x2="76" y2="50" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
              <line x1="64" y1="52" x2="76" y2="56" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="round"/>
            </g>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#otter-tile)"/>
      </svg>

      <!-- Esquinas ornamentales tipo papel antiguo -->
      <svg class="corner tl" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12 Q2 2 12 2" stroke="#5a3210" stroke-width="1.4" fill="none"/>
        <path d="M2 20 Q2 2 20 2" stroke="#5a3210" stroke-width="1" fill="none" opacity="0.7"/>
        <circle cx="10" cy="10" r="2" fill="#5a3210" opacity="0.55"/>
        <path d="M2 6 Q6 6 6 2" stroke="#5a3210" stroke-width="1.2" fill="none"/>
      </svg>
      <svg class="corner tr" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12 Q2 2 12 2" stroke="#5a3210" stroke-width="1.4" fill="none"/>
        <path d="M2 20 Q2 2 20 2" stroke="#5a3210" stroke-width="1" fill="none" opacity="0.7"/>
        <circle cx="10" cy="10" r="2" fill="#5a3210" opacity="0.55"/>
        <path d="M2 6 Q6 6 6 2" stroke="#5a3210" stroke-width="1.2" fill="none"/>
      </svg>
      <svg class="corner bl" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12 Q2 2 12 2" stroke="#5a3210" stroke-width="1.4" fill="none"/>
        <path d="M2 20 Q2 2 20 2" stroke="#5a3210" stroke-width="1" fill="none" opacity="0.7"/>
        <circle cx="10" cy="10" r="2" fill="#5a3210" opacity="0.55"/>
        <path d="M2 6 Q6 6 6 2" stroke="#5a3210" stroke-width="1.2" fill="none"/>
      </svg>
      <svg class="corner br" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12 Q2 2 12 2" stroke="#5a3210" stroke-width="1.4" fill="none"/>
        <path d="M2 20 Q2 2 20 2" stroke="#5a3210" stroke-width="1" fill="none" opacity="0.7"/>
        <circle cx="10" cy="10" r="2" fill="#5a3210" opacity="0.55"/>
        <path d="M2 6 Q6 6 6 2" stroke="#5a3210" stroke-width="1.2" fill="none"/>
      </svg>

      <div id="text"></div>
    </div>

    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">
      <svg viewBox="0 0 24 24" fill="#ffe9b0" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
  </div>
</main>

<script>
// ====== MENSAJE ======
const CARTA = {
  para: "Para ti",
  saludo: "Buenos días",
  lineas: [
    "Hoy la luna se esconde a plena vista, como tu presencia en este mundo: silenciosa, luminosa, imposible de ignorar.",
    "Quería desearte un lindo día y que con estas estrellas comiences tu mañana con calma y con luz.",
    "Que Dios te acompañe siempre, hoy y en cada paso que des."
  ],
  bendiciones: "Bendiciones",
  atte: "Atte: Ulises"
};
// =====================

const c = document.getElementById('sky'), x = c.getContext('2d');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2), opened = false, falling = [], acc = 0, last = 0;
function size(){ W = innerWidth; H = innerHeight; c.width = W * DPR; c.height = H * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', size); size();

const still = Array.from({length: 110}, () => ({x: Math.random(), y: Math.random() * .85, r: Math.random() * 1.3 + .3, p: Math.random() * 6.28, s: Math.random() * 1.5 + .5}));

function spawn(){
  const ang = Math.PI * (.62 + Math.random() * .1), sp = 2.5 + Math.random() * 3.5;
  falling.push({x: Math.random() * W * 1.2, y: -30, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, len: 14 + Math.random() * 16, r: 1.2 + Math.random() * 1.6});
}

function draw(t){
  const dt = Math.min(50, t - last) / 16.67; last = t;
  x.clearRect(0, 0, W, H);
  for (const s of still){
    x.globalAlpha = .35 + .5 * Math.abs(Math.sin(t / 1000 * s.s + s.p));
    x.fillStyle = '#fff'; x.beginPath(); x.arc(s.x * W, s.y * H, s.r, 0, 6.283); x.fill();
  }
  x.globalAlpha = 1;
  acc += dt * 16.67;
  if (acc > (opened ? 420 : 1700) * (calm ? 3 : 1)){ acc = 0; spawn(); }
  falling = falling.filter(f => f.y < H + 80 && f.x > -80);
  for (const f of falling){
    f.x += f.vx * dt; f.y += f.vy * dt;
    const tx = f.x - f.vx * f.len, ty = f.y - f.vy * f.len;
    const g = x.createLinearGradient(f.x, f.y, tx, ty);
    g.addColorStop(0, 'rgba(255,240,190,.95)'); g.addColorStop(1, 'rgba(255,200,120,0)');
    x.strokeStyle = g; x.lineWidth = f.r; x.lineCap = 'round';
    x.beginPath(); x.moveTo(f.x, f.y); x.lineTo(tx, ty); x.stroke();
    x.fillStyle = '#fff'; x.shadowColor = 'rgba(255,230,160,.9)'; x.shadowBlur = 10;
    x.beginPath(); x.arc(f.x, f.y, f.r * .9, 0, 6.283); x.fill(); x.shadowBlur = 0;
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(t => { last = t; draw(t); });

function showText(){
  const box = document.getElementById('text'); let i = 0;
  const add = (tag, cls, txt) => {
    const e = document.createElement(tag); e.className = 'l ' + cls; e.textContent = txt;
    e.style.animationDelay = (i++ * 1.2) + 's'; box.appendChild(e);
    return e;
  };
  if (CARTA.para) add('div', 'para', CARTA.para);
  add('h1', '', CARTA.saludo);
  CARTA.lineas.forEach(l => add('p', '', l));

  const firma = document.createElement('div');
  firma.className = 'l firma';
  firma.style.animationDelay = (i++ * 1.2) + 's';

  const bend = document.createElement('div');
  bend.className = 'bendiciones';
  bend.textContent = CARTA.bendiciones;
  firma.appendChild(bend);

  const atte = document.createElement('span');
  atte.className = 'atte';
  atte.textContent = CARTA.atte;
  firma.appendChild(atte);

  box.appendChild(firma);
}

function openIt(){
  if (opened) return; opened = true;
  document.body.classList.add('open');
  for (let i = 0; i < 10; i++) setTimeout(spawn, i * 130);
  setTimeout(() => document.body.classList.add('read'), 1600);
  setTimeout(showText, 2300);
}
const env = document.getElementById('env');
env.addEventListener('click', openIt);
env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openIt(); });
</script>
</body>
</html>
